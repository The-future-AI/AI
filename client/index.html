<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Contextual News — Veja todos os lados de cada notícia</title>
    <meta name="description" content="Agregador de notícias brasileiras com análise de viés político. Compare como esquerda, centro e direita cobrem os mesmos eventos." />

    <!-- Open Graph (compartilhamento em WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:site_name" content="Contextual News" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Contextual News — Veja todos os lados de cada notícia" />
    <meta property="og:description" content="Compare como esquerda, centro e direita cobrem os mesmos eventos. Análise contextual da mídia brasileira." />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Contextual News — Veja todos os lados de cada notícia" />
    <meta name="twitter:description" content="Compare como esquerda, centro e direita cobrem os mesmos eventos. Análise contextual da mídia brasileira." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      h1, h2, h3, h4 { font-family: 'Merriweather', Georgia, serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
